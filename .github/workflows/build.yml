name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          mkdir -p build-src
          unzip -o MiHealth_Operit_Bridge_0.1.zip -d build-src

      - name: Fix Android build configuration
        run: |
          cat > build-src/healthbridge/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.xixi.healthbridge"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.xixi.healthbridge"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-ktx:1.11.0")
              implementation("androidx.health.connect:connect-client:1.1.0")
          }
          EOF

      - name: Build Debug APK
        working-directory: build-src
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: healthbridge-debug
          path: build-src/healthbridge/build/outputs/apk/debug/healthbridge-debug.apk
