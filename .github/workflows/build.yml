name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          mkdir build-src
          unzip -o MiHealth_Operit_Bridge_0.1.zip -d build-src

      - name: Build Debug APK
        working-directory: build-src
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: healthbridge-debug
          path: build-src/healthbridge/build/outputs/apk/debug/healthbridge-debug.apk
